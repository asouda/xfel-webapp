[project]
name = "xfel-webapp"
version = "0.1.0"
description = "Workflows for XFEL electron density maps"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "gemmi>=0.6.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6",
    "scipy>=1.11",
]

authors = [
    {name = "Alexander Soudackov", email = "asoudakov@icloud.com"}
]

license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/asouda/xfel-webapp"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
]
